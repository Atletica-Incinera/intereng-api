services:
  postgres:
    image: postgres:16-alpine
    container_name: intereng-postgres
    restart: always
    # Publicado apenas no loopback. Antes era 0.0.0.0, o que expunha o banco a
    # qualquer host que alcançasse a máquina — e regras de firewall não filtram
    # portas publicadas pelo Docker, porque elas entram por DNAT antes do filtro.
    # A API não usa esta porta: fala com o Postgres pelo nome do serviço na rede
    # interna. Ela existe só para inspeção local.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-competitions}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
    volumes:
      - intereng_postgres_data:/var/lib/postgresql/data
    networks:
      - intereng-internal
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: intereng-redis
    restart: always
    # O Redis não tinha autenticação alguma. Como ele guarda o cache do snapshot
    # público, quem alcançasse a porta conseguia reescrever a classificação que
    # os espectadores veem. A senha e a REDIS_URL da API saem da MESMA variável,
    # para não existir estado em que uma mude sem a outra.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-intereng_redis_local}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - intereng_redis_data:/data
    networks:
      - intereng-internal
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # Sem storage o upload de logo assina uma policy contra a AWS real, sem
  # credencial, e falha no navegador do usuário. O MinIO fecha isso dentro da
  # própria VM, sem conta externa.
  #
  # Ele fica nas duas redes de propósito: a API o alcança por `intereng-minio`
  # na rede interna, e o proxy precisa alcançá-lo pela `incinera-network` para
  # servir o upload assinado e a leitura pública ao navegador.
  minio:
    image: quay.io/minio/minio:latest
    container_name: intereng-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-intereng}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?defina S3_SECRET_ACCESS_KEY no .env}
    # Somente loopback, como o Postgres e o Redis: o acesso do navegador entra
    # pelo proxy, não por esta porta.
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - intereng_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - intereng-internal
      - incinera-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # Cria o bucket e libera leitura anônima apenas do prefixo `teams/`, que é
  # onde as logos ficam. O restante do bucket continua fechado. Roda uma vez e
  # sai; é idempotente, então repetir o deploy não quebra nada.
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: intereng-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://intereng-minio:9000 '${S3_ACCESS_KEY_ID:-intereng}' '${S3_SECRET_ACCESS_KEY:?defina S3_SECRET_ACCESS_KEY no .env}' &&
      mc mb --ignore-existing local/${S3_BUCKET:-intereng} &&
      mc anonymous set download local/${S3_BUCKET:-intereng}/teams
      "
    restart: "no"
    networks:
      - intereng-internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intereng-api
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass}@intereng-postgres:5432/${POSTGRES_DB:-competitions}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:-intereng_redis_local}@intereng-redis:6379
      - REDIS_STREAM_TTL=${REDIS_STREAM_TTL:-7200}
      - JWT_SECRET=${JWT_SECRET}
      # Endereço interno: é por aqui que a API lê e apaga objetos. O endereço
      # que o NAVEGADOR usa é outro — S3_PRESIGN_ENDPOINT e S3_PUBLIC_BASE_URL
      # vêm do .env porque dependem do domínio público e do proxy, que mudam
      # por implantação.
      - S3_ENDPOINT=http://intereng-minio:9000
      - S3_FORCE_PATH_STYLE=true
      - S3_BUCKET=${S3_BUCKET:-intereng}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-intereng}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:?defina S3_SECRET_ACCESS_KEY no .env}
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - intereng-internal
      - incinera-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

volumes:
  intereng_postgres_data:
  intereng_redis_data:
  intereng_minio_data:

networks:
  intereng-internal:
    driver: bridge
  incinera-network:
    external: true
